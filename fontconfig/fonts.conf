<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">

<fontconfig>

    <!--
        fonts.conf находится в:
        /project/fontconfig/fonts.conf

        Поэтому ../assets/fonts =
        /project/assets/fonts
    -->
    <dir>../assets/fonts</dir>

    <!-- Кэш -->
    <cachedir>~/.cache/fontconfig</cachedir>
    <cachedir>/tmp/fontconfig</cachedir>

    <!-- Russo One -->
    <match target="pattern">
        <test name="family" qual="any">
            <string>Russo One</string>
        </test>

        <edit
            name="family"
            mode="prepend"
            binding="strong"
        >
            <string>Russo One</string>
        </edit>
    </match>

    <!-- Алиас -->
    <alias>
        <family>RussoOne</family>

        <prefer>
            <family>Russo One</family>
        </prefer>
    </alias>

</fontconfig>
