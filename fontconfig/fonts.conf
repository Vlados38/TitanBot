<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">

<fontconfig>

    <!-- Папка с пользовательскими шрифтами -->
    <dir>/app/assets/fonts</dir>

    <!-- Кэш Fontconfig -->
    <cachedir>/tmp/fontconfig</cachedir>

    <!-- Russo One -->
    <match target="pattern">
        <test name="family" qual="any">
            <string>Russo One</string>
        </test>

        <edit name="family" mode="prepend" binding="strong">
            <string>Russo One</string>
        </edit>
    </match>

    <!-- Алиас для SVG -->
    <alias>
        <family>RussoOne</family>
        <prefer>
            <family>Russo One</family>
        </prefer>
    </alias>

</fontconfig>
